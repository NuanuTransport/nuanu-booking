<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Board</title>
<style>
:root{
  --ink:#17251E; --paper:#F1F3EF; --card:#fff;
  --line:#C9D2CB; --muted:#5C6B62; --moss:#2E6B4C; --stop:#B03A2E;
  --blue:#2F4E8F; --amber:#B07D00;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;
}
.bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:13px 22px;background:var(--ink);color:#fff;flex-wrap:wrap;gap:12px;
}
.bar h1{font-size:18px;margin:0;font-weight:600}
.bar .sub{font-size:13px;opacity:.7}
.bar .clock{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}

.tools{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:12px 22px;background:#E4EAE4;border-bottom:1px solid var(--line);
}
.tools button{
  padding:9px 16px;font-size:14px;font-weight:600;font-family:inherit;
  background:var(--card);color:var(--muted);
  border:1px solid var(--line);border-radius:6px;cursor:pointer;
}
.tools button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools select{
  padding:9px 12px;font-size:14px;font-family:inherit;min-width:190px;
  border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);
}
.tools .spacer{flex:1}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:14px;padding:18px 22px 40px;
}
.job{
  background:var(--card);border:1px solid var(--line);border-left:6px solid var(--moss);
  border-radius:8px;padding:15px;
}
.job.ONGOING{border-left-color:var(--blue);background:#F7F9FD}
.job.COMPLETED{border-left-color:var(--muted);opacity:.75}
.job.CANCELLED,.job.NOSHOW,.job.REJECTED{border-left-color:var(--stop);opacity:.75}
.job.PENDING{border-left-color:var(--amber)}
.job .when{font-size:13px;color:var(--muted);font-weight:600}
.job .time{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.job .id{font-size:12px;color:var(--muted);margin-top:2px}
.job .driver{font-size:16px;font-weight:600;margin-top:9px}
.job p{margin:5px 0 0;font-size:14px;color:var(--muted)}
.job .tag{
  display:inline-block;margin-top:9px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:20px;background:#E4EAE4;color:var(--muted);
}
.job .tag.ONGOING{background:#E8EDF6;color:var(--blue)}
.acts{display:flex;gap:9px;margin-top:13px}
.acts button{
  flex:1;padding:12px 6px;font-size:14.5px;font-weight:600;font-family:inherit;
  border-radius:6px;cursor:pointer;border:0;color:#fff;
}
.go{background:var(--moss)}
.fin{background:var(--blue)}
.cxl{background:var(--card);border:1px solid var(--stop);color:var(--stop)}
.acts button:disabled{opacity:.5;cursor:wait}

.empty{padding:60px 22px;text-align:center;color:var(--muted);font-size:17px}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:8px;
  font-size:15px;display:none;max-width:88vw;box-shadow:0 4px 16px rgba(0,0,0,.2);
}
</style>
</head>
<body>

<div class="bar">
  <div>
    <h1>Dispatch Board</h1>
    <div class="sub" id="title"></div>
  </div>
  <div class="clock" id="clock">--:--</div>
</div>

<div class="tools">
  <button id="b-today" class="on" onclick="setMode('today')">Today</button>
  <button id="b-tomorrow" onclick="setMode('tomorrow')">Tomorrow</button>
  <span class="spacer"></span>
  <select id="driver" onchange="pickDriver()">
    <option value="">Search by driver…</option>
  </select>
</div>

<div id="body"><p class="empty">Loading…</p></div>
<div id="toast"></div>

<script>
/* ==========================================================
   PASTE YOUR APPS SCRIPT /exec URL BETWEEN THE QUOTES BELOW
   ========================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzgpjJpb96wLeKH0mHQfNJmtgk7nbuj34zpUxATGDRM_ReShbIVz-kegSBIdElie4dt/exec';
/* ========================================================== */

var TOKEN = '';
try { TOKEN = new URLSearchParams(location.search).get('t') || ''; }
catch (e) { var m = location.search.match(/[?&]t=([^&]+)/); TOKEN = m ? m[1] : ''; }

var MODE = 'today';
var DRIVER = '';
var driversLoaded = false;

function api(action, data) {
  var url = API_URL +
    '?action=' + encodeURIComponent(action) +
    '&t=' + encodeURIComponent(TOKEN) +
    '&data=' + encodeURIComponent(JSON.stringify(data || {})) +
    '&cb=' + Date.now();
  return fetch(url).then(function (r) { return r.json(); });
}

function toast(text) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 4000);
}

function tick() {
  var d = new Date();
  document.getElementById('clock').textContent =
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
tick();
setInterval(tick, 20000);

function setMode(mode) {
  MODE = mode;
  DRIVER = '';
  document.getElementById('driver').value = '';
  document.getElementById('b-today').className = (mode === 'today' ? 'on' : '');
  document.getElementById('b-tomorrow').className = (mode === 'tomorrow' ? 'on' : '');
  load();
}

function pickDriver() {
  var v = document.getElementById('driver').value;
  if (!v) { setMode('today'); return; }
  MODE = 'driver';
  DRIVER = v;
  document.getElementById('b-today').className = '';
  document.getElementById('b-tomorrow').className = '';
  load();
}

function money(n) { return Number(n || 0).toLocaleString('id-ID'); }

function load() {
  api('board', { mode: MODE, driver: DRIVER }).then(function (r) {
    var box = document.getElementById('body');
    if (!r || !r.ok) {
      box.innerHTML = '<p class="empty">' + ((r && r.message) || 'Could not load.') + '</p>';
      return;
    }

    document.getElementById('title').textContent = r.title || '';

    if (!driversLoaded && r.drivers && r.drivers.length) {
      document.getElementById('driver').innerHTML =
        '<option value="">Search by driver…</option>' +
        r.drivers.map(function (d) { return '<option>' + d + '</option>'; }).join('');
      driversLoaded = true;
    }

    if (!r.jobs.length) {
      box.innerHTML = '<p class="empty">' +
        (MODE === 'driver' ? 'No open jobs for this driver.' : 'Nothing scheduled.') + '</p>';
      return;
    }

    box.innerHTML = '<div class="grid">' + r.jobs.map(function (j) {
      var acts = '';
      if (j.live) {
        acts = (j.status === 'ONGOING')
          ? '<button class="fin" onclick="act(\'finish\',\'' + j.id + '\',this)">Finish trip</button>'
          : '<button class="go" onclick="act(\'go\',\'' + j.id + '\',this)">Start trip</button>';
        acts += '<button class="cxl" onclick="act(\'cancel\',\'' + j.id + '\',this)">Cancel</button>';
      }

      var cls = j.status.replace(/ /g, '');

      return '<div class="job ' + cls + '">' +
        (MODE === 'today' ? '' : '<div class="when">' + j.dateShort + '</div>') +
        '<div class="time">' + j.start + ' – ' + j.end + '</div>' +
        '<div class="id">' + j.id + '</div>' +
        '<div class="driver">' + j.driver + '</div>' +
        '<p>' + j.vehicle + '</p>' +
        '<p>' + j.pickup + ' \u2192 ' + j.dropoff + '</p>' +
        '<p>' + j.req + '</p>' +
        (j.purpose && j.purpose !== '-' ? '<p>' + j.purpose + '</p>' : '') +
        (j.astart ? '<p>Ran ' + j.astart + (j.aend ? ' – ' + j.aend : ' — still out') + '</p>' : '') +
        (j.total ? '<p>' + money(j.total) + '</p>' : '') +
        '<span class="tag ' + cls + '">' + j.status + '</span>' +
        (acts ? '<div class="acts">' + acts + '</div>' : '') +
      '</div>';
    }).join('') + '</div>';
  }).catch(function (err) {
    document.getElementById('body').innerHTML =
      '<p class="empty">Could not reach the server.<br>' + err.message + '</p>';
  });
}

load();
setInterval(function () { if (MODE === 'today') load(); }, 60000);
</script>
</body>
</html>
