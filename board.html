<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Board</title>
<style>
:root{
  --ink:#17251E; --paper:#F1F3EF; --card:#fff;
  --line:#C9D2CB; --muted:#5C6B62; --moss:#2E6B4C; --stop:#B03A2E;
  --blue:#2F4E8F; --amber:#B07D00;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;
}
.bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 22px;background:var(--ink);color:#fff;
}
.bar h1{font-size:18px;margin:0;font-weight:600}
.bar .sub{font-size:13px;opacity:.7}
.bar .clock{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}

nav{display:flex;gap:6px;padding:12px 22px 0;background:var(--ink)}
nav button{
  padding:9px 18px;font-size:14px;font-weight:600;font-family:inherit;
  background:rgba(255,255,255,.12);color:#fff;border:0;
  border-radius:7px 7px 0 0;cursor:pointer;
}
nav button.on{background:var(--paper);color:var(--ink)}
nav .count{
  display:inline-block;margin-left:7px;background:var(--stop);color:#fff;
  border-radius:20px;padding:1px 7px;font-size:12px;
}

.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:14px;padding:18px 22px 40px;
}
.job{
  background:var(--card);border:1px solid var(--line);border-left:6px solid var(--moss);
  border-radius:8px;padding:15px;
}
.job.ONGOING{border-left-color:var(--blue);background:#F7F9FD}
.job.PENDING{border-left-color:var(--amber);background:#FDFBF5}
.job .time{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.job .id{font-size:12px;color:var(--muted);margin-top:2px}
.job .driver{font-size:17px;font-weight:600;margin-top:10px}
.job .driver.none{color:var(--amber)}
.job p{margin:5px 0 0;font-size:14.5px;color:var(--muted)}
.job .live{
  display:inline-block;margin-top:9px;font-size:12px;font-weight:600;
  background:#E8EDF6;color:var(--blue);padding:3px 9px;border-radius:20px;
}
.acts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.acts button{
  flex:1 1 120px;padding:12px 6px;font-size:15px;font-weight:600;font-family:inherit;
  border-radius:6px;cursor:pointer;border:0;color:#fff;
}
.go{background:var(--moss)}
.fin{background:var(--blue)}
.cxl{background:var(--card) !important;border:1px solid var(--stop) !important;color:var(--stop) !important}
.acts button:disabled{opacity:.5;cursor:wait}

.pick{margin-top:12px;display:none}
.pick.on{display:block}
.pick p{margin:0 0 7px;font-size:13px;font-weight:600;color:var(--ink)}
.pick .names{display:flex;flex-wrap:wrap;gap:7px}
.pick .names button{
  flex:0 0 auto;padding:9px 13px;font-size:14px;font-weight:600;font-family:inherit;
  background:var(--moss);color:#fff;border:0;border-radius:6px;cursor:pointer;
}

.empty{padding:70px 22px;text-align:center;color:var(--muted);font-size:18px}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:8px;
  font-size:15px;display:none;max-width:88vw;box-shadow:0 4px 16px rgba(0,0,0,.2);
}
</style>
</head>
<body>

<div class="bar">
  <div>
    <h1>Dispatch Board</h1>
    <div class="sub" id="label"></div>
  </div>
  <div class="clock" id="clock">--:--</div>
</div>

<select id="dfilter" onchange="load()"
    style="margin-left:auto;align-self:center;padding:8px 10px;border-radius:6px;
           border:0;font-family:inherit;font-size:14px">
    <option value="">All drivers</option>
  </select>
  
<nav>
  <button id="tab-today" class="on" onclick="go('today')">Today</button>
  <button id="tab-tomorrow" onclick="go('tomorrow')">Tomorrow</button>
  <button id="tab-pending" onclick="go('pending')">Waiting<span class="count" id="pcount" style="display:none">0</span></button>
</nav>

<div id="body"><p class="empty">Loading…</p></div>
<div id="toast"></div>

<script>
/* ==========================================================
   PASTE YOUR APPS SCRIPT /exec URL BETWEEN THE QUOTES BELOW
   ========================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzgpjJpb96wLeKH0mHQfNJmtgk7nbuj34zpUxATGDRM_ReShbIVz-kegSBIdElie4dt/exec';
/* ========================================================== */

var TOKEN = '';
try { TOKEN = new URLSearchParams(location.search).get('t') || ''; }
catch (e) { var m = location.search.match(/[?&]t=([^&]+)/); TOKEN = m ? m[1] : ''; }

var VIEW = 'today';
var DRIVERS = [];

function api(action, data) {
  var url = API_URL +
    '?action=' + encodeURIComponent(action) +
    '&t=' + encodeURIComponent(TOKEN) +
    '&data=' + encodeURIComponent(JSON.stringify(data || {})) +
    '&cb=' + Date.now();
  return fetch(url).then(function (r) { return r.json(); });
}

function toast(text) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 4500);
}

function tick() {
  var d = new Date();
  document.getElementById('clock').textContent =
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
tick();
setInterval(tick, 20000);

function go(which) {
  VIEW = which;
  ['today', 'tomorrow', 'pending'].forEach(function (n) {
    document.getElementById('tab-' + n).className = (n === which ? 'on' : '');
  });
  load();
}

api('drivers').then(function (r) {
       if (!r || !r.ok) return;
       DRIVERS = r.drivers;
       var sel = document.getElementById('dfilter');
       sel.innerHTML = '<option value="">All drivers</option>' +
         DRIVERS.map(function (d) {
           return '<option value="' + d.id + '">' + d.name + '</option>';
         }).join('');
       if (r.role === 'driver') sel.style.display = 'none';
     });
  
function load() {
  var who = document.getElementById('dfilter').value;
     api('board', { when: VIEW, driverId: who }).then(function (r) {
    var box = document.getElementById('body');
    if (!r || !r.ok) {
      box.innerHTML = '<p class="empty">' + ((r && r.message) || 'Could not load.') + '</p>';
      return;
    }

    document.getElementById('label').textContent = r.label || '';

    if (!r.jobs.length) {
      box.innerHTML = '<p class="empty">' +
        (VIEW === 'pending' ? 'Nothing waiting for a driver.' : 'No jobs for this day.') + '</p>';
      if (VIEW === 'pending') setCount(0);
      return;
    }
    if (VIEW === 'pending') setCount(r.jobs.length);

    box.innerHTML = '<div class="grid">' + r.jobs.map(function (j) {
      var acts = '';

      if (j.status === 'PENDING') {
        acts = '<button class="go" onclick="showPick(\'' + j.id + '\')">Assign driver</button>';
      } else if (j.status === 'ONGOING') {
        acts = '<button class="fin" onclick="act(\'finish\',\'' + j.id + '\',this)">Finish trip</button>';
      } else {
        acts = '<button class="go" onclick="act(\'go\',\'' + j.id + '\',this)">Start trip</button>';
      }
      acts += '<button class="cxl" onclick="act(\'cancel\',\'' + j.id + '\',this)">Cancel</button>';

      var who = j.selfDrive ? 'SELF DRIVE' : (j.driver || 'no driver yet');

      return '<div class="job ' + j.status + '">' +
        '<div class="time">' + j.start + ' \u2013 ' + j.end + '</div>' +
        '<div class="id">' + j.id + ' \u00b7 ' + j.date + ' \u00b7 ' + j.status + '</div>' +
        '<div class="driver' + (j.driver || j.selfDrive ? '' : ' none') + '">' + who + '</div>' +
        '<p>' + j.vehicle + '</p>' +
        '<p>' + j.pickup + ' \u2192 ' + j.dropoff + '</p>' +
        '<p>' + j.req + '</p>' +
        (j.purpose ? '<p>' + j.purpose + '</p>' : '') +
        (j.astart ? '<span class="live">Running since ' + j.astart + '</span>' : '') +
        '<div class="acts">' + acts + '</div>' +
        '<div class="pick" id="pick-' + j.id + '">' +
          '<p>Which driver?</p><div class="names">' +
          DRIVERS.map(function (d) {
            return '<button onclick="assign(\'' + j.id + '\',\'' + d.id + '\')">' + d.name + '</button>';
          }).join('') +
          (DRIVERS.length ? '' : '<span style="color:#5C6B62;font-size:14px">No active drivers in People.</span>') +
        '</div></div>' +
      '</div>';
    }).join('') + '</div>';
  }).catch(function (err) {
    document.getElementById('body').innerHTML =
      '<p class="empty">Could not reach the server.<br>' + err.message + '</p>';
  });
}

function setCount(n) {
  var el = document.getElementById('pcount');
  el.textContent = n;
  el.style.display = n ? 'inline-block' : 'none';
}

function showPick(id) {
  var el = document.getElementById('pick-' + id);
  el.className = (el.className.indexOf('on') > -1) ? 'pick' : 'pick on';
}

function assign(id, driverId) {
  api('assign', { id: id, driverId: driverId }).then(function (res) {
    toast(res && res.message ? res.message : 'Done');
    load();
  }).catch(function (err) { toast('Failed: ' + err.message); });
}

function act(what, id, btn) {
  if (what === 'cancel' && !confirm('Cancel ' + id + '?')) return;
  btn.disabled = true;
  api(what, { id: id, reason: 'from dispatch board' }).then(function (res) {
    toast(res && res.message ? res.message : 'Done');
    load();
  }).catch(function (err) {
    toast('Failed: ' + err.message);
    btn.disabled = false;
  });
}

function refreshCount() {
  api('board', { when: 'pending' }).then(function (r) {
    if (r && r.ok) setCount(r.jobs.length);
  });
}
refreshCount();
setInterval(refreshCount, 60000);

load();
setInterval(load, 60000);
</script>
</body>
</html>
