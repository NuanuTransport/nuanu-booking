<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Board</title>
<style>
:root{
  --ink:#17251E; --paper:#F1F3EF; --card:#fff;
  --line:#C9D2CB; --muted:#5C6B62; --moss:#2E6B4C; --stop:#B03A2E;
  --blue:#2F4E8F; --amber:#B07D00;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;
}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:var(--ink);color:#fff}
.bar h1{font-size:18px;margin:0;font-weight:600}
.bar .sub{font-size:13px;opacity:.7}
.bar .clock{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}

nav{display:flex;gap:6px;padding:12px 22px 0;background:var(--ink);align-items:center}
nav button{
  padding:9px 18px;font-size:14px;font-weight:600;font-family:inherit;
  background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:7px 7px 0 0;cursor:pointer;
}
nav button.on{background:var(--paper);color:var(--ink)}
nav .count{display:inline-block;margin-left:7px;background:var(--stop);color:#fff;border-radius:20px;padding:1px 7px;font-size:12px}
nav select{margin-left:auto;padding:8px 10px;border-radius:6px;border:0;font-family:inherit;font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:18px 22px 40px}
.job{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--moss);border-radius:8px;padding:15px}
.job.ONGOING{border-left-color:var(--blue);background:#F7F9FD}
.job.PENDING{border-left-color:var(--amber);background:#FDFBF5}
.job .time{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.job .id{font-size:12px;color:var(--muted);margin-top:2px}
.job .driver{font-size:17px;font-weight:600;margin-top:10px}
.job .driver.none{color:var(--amber)}
.job p{margin:5px 0 0;font-size:14.5px;color:var(--muted)}
.job .live{display:inline-block;margin-top:9px;font-size:12px;font-weight:600;background:#E8EDF6;color:var(--blue);padding:3px 9px;border-radius:20px}
.acts{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.acts button{flex:1 1 120px;padding:12px 6px;font-size:15px;font-weight:600;font-family:inherit;border-radius:6px;cursor:pointer;border:0;color:#fff}
.go{background:var(--moss)}
.fin{background:var(--blue)}
.cxl{background:var(--card) !important;border:1px solid var(--stop) !important;color:var(--stop) !important}
.acts button:disabled{opacity:.5;cursor:wait}
.pick{margin-top:12px;display:none}
.pick.on{display:block}
.pick p{margin:0 0 7px;font-size:13px;font-weight:600}
.pick .names{display:flex;flex-wrap:wrap;gap:7px}
.pick .names button{flex:0 0 auto;padding:9px 13px;font-size:14px;font-weight:600;font-family:inherit;background:var(--moss);color:#fff;border:0;border-radius:6px;cursor:pointer}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:10px;padding:16px 22px 0;flex-wrap:wrap}
.calbar .seg{display:flex;background:#E4EAE4;border-radius:7px;padding:3px}
.calbar .seg button{padding:8px 16px;font-size:14px;font-weight:600;font-family:inherit;background:transparent;color:var(--muted);border:0;border-radius:5px;cursor:pointer}
.calbar .seg button.on{background:var(--card);color:var(--ink)}
.calbar .nav{display:flex;gap:6px}
.calbar .nav button{padding:8px 14px;font-size:15px;font-weight:600;font-family:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.calbar .title{font-size:17px;font-weight:600;margin-left:6px}

.calwrap{padding:16px 22px 40px;overflow-x:auto}
table.cal{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px}
table.cal th,table.cal td{border:1px solid var(--line);padding:0;vertical-align:top}
table.cal th{background:#E4EAE4;font-size:12px;font-weight:600;padding:7px 5px;text-align:center;white-space:nowrap}
table.cal th.rowhead,table.cal td.rowhead{
  text-align:left;padding:10px 12px;width:150px;min-width:150px;
  font-weight:600;font-size:14px;background:#F6F8F5;
}
td.rowhead small{display:block;font-weight:400;color:var(--muted);font-size:12px}

/* day view track */
.track{position:relative;height:54px}
.hourline{position:absolute;top:0;bottom:0;width:1px;background:#EDF0EC}
.bar2{
  position:absolute;border-radius:5px;padding:3px 7px;overflow:hidden;
  font-size:11.5px;line-height:1.25;color:#fff;white-space:nowrap;text-overflow:ellipsis;cursor:default;
}
.bar2.APPROVED{background:var(--moss)}
.bar2.ONGOING{background:var(--blue)}
.bar2.PENDING{background:var(--amber)}
.bar2.COMPLETED{background:#8A968E}
.bar2 b{font-weight:600}

/* week + month cells */
.cell{padding:7px 6px;min-height:66px}
.cell .load{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}
.cell .load.full{color:var(--stop)}
.chip{
  display:block;border-radius:4px;padding:2px 6px;margin-bottom:3px;
  font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.chip.APPROVED{background:var(--moss)}
.chip.ONGOING{background:var(--blue)}
.chip.PENDING{background:var(--amber)}
.chip.COMPLETED{background:#8A968E}
td.today{background:#FFFBEF}
.legend{display:flex;gap:16px;padding:0 22px 30px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:3px;display:inline-block}

.empty{padding:70px 22px;text-align:center;color:var(--muted);font-size:18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 22px;border-radius:8px;font-size:15px;display:none;max-width:88vw;box-shadow:0 4px 16px rgba(0,0,0,.2)}
</style>
</head>
<body>

<div class="bar">
  <div>
    <h1>Dispatch Board</h1>
    <div class="sub" id="label"></div>
  </div>
  <div class="clock" id="clock">--:--</div>
</div>

<nav>
  <button id="tab-today" class="on" onclick="go('today')">Today</button>
  <button id="tab-tomorrow" onclick="go('tomorrow')">Tomorrow</button>
  <button id="tab-pending" onclick="go('pending')">Waiting<span class="count" id="pcount" style="display:none">0</span></button>
  <button id="tab-calendar" onclick="go('calendar')">Calendar</button>
  <select id="dfilter" onchange="load()"><option value="">All drivers</option></select>
</nav>

<div id="calbar" class="calbar" style="display:none">
  <div class="seg">
    <button id="m-day" class="on" onclick="setMode('day')">Day</button>
    <button id="m-week" onclick="setMode('week')">Week</button>
    <button id="m-month" onclick="setMode('month')">Month</button>
  </div>
  <div class="nav">
    <button onclick="step(-1)">‹</button>
    <button onclick="today()">Today</button>
    <button onclick="step(1)">›</button>
  </div>
  <div class="title" id="caltitle"></div>
</div>

<div id="body"><p class="empty">Loading…</p></div>
<div id="toast"></div>

<script>
/* ==========================================================
   PASTE YOUR APPS SCRIPT /exec URL BETWEEN THE QUOTES BELOW
   ========================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzgpjJpb96wLeKH0mHQfNJmtgk7nbuj34zpUxATGDRM_ReShbIVz-kegSBIdElie4dt/exec';
/* ========================================================== */

var TOKEN = '';
try { TOKEN = new URLSearchParams(location.search).get('t') || ''; }
catch (e) { var m0 = location.search.match(/[?&]t=([^&]+)/); TOKEN = m0 ? m0[1] : ''; }

var VIEW = 'today';
var DRIVERS = [];
var CAL_MODE = 'day';
var CAL_DATE = isoToday();

function isoToday() {
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function api(action, data) {
  var url = API_URL +
    '?action=' + encodeURIComponent(action) +
    '&t=' + encodeURIComponent(TOKEN) +
    '&data=' + encodeURIComponent(JSON.stringify(data || {})) +
    '&cb=' + Date.now();
  return fetch(url).then(function (r) { return r.json(); });
}

function toast(text) {
  var t = document.getElementById('toast');
  t.textContent = text;
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 4500);
}

function tick() {
  var d = new Date();
  document.getElementById('clock').textContent =
    ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}
tick(); setInterval(tick, 20000);

function go(which) {
  VIEW = which;
  ['today', 'tomorrow', 'pending', 'calendar'].forEach(function (n) {
    document.getElementById('tab-' + n).className = (n === which ? 'on' : '');
  });
  document.getElementById('calbar').style.display = (which === 'calendar') ? 'flex' : 'none';
  document.getElementById('dfilter').style.display = (which === 'calendar') ? 'none' : '';
  load();
}

api('drivers').then(function (r) {
  if (!r || !r.ok) return;
  DRIVERS = r.drivers;
  var sel = document.getElementById('dfilter');
  sel.innerHTML = '<option value="">All drivers</option>' +
    DRIVERS.map(function (d) { return '<option value="' + d.id + '">' + d.name + '</option>'; }).join('');
  if (r.role === 'driver') sel.style.display = 'none';
});

function load() {
  if (VIEW === 'calendar') return loadCal();

  var who = document.getElementById('dfilter').value;
  api('board', { when: VIEW, driverId: who }).then(function (r) {
    var box = document.getElementById('body');
    if (!r || !r.ok) { box.innerHTML = '<p class="empty">' + ((r && r.message) || 'Could not load.') + '</p>'; return; }

    document.getElementById('label').textContent = r.label || '';

    if (!r.jobs.length) {
      box.innerHTML = '<p class="empty">' +
        (VIEW === 'pending' ? 'Nothing waiting for a driver.' : 'No jobs for this day.') + '</p>';
      if (VIEW === 'pending') setCount(0);
      return;
    }
    if (VIEW === 'pending') setCount(r.jobs.length);

    box.innerHTML = '<div class="grid">' + r.jobs.map(function (j) {
      var acts = '';
      if (j.status === 'PENDING')      acts = '<button class="go" onclick="showPick(\'' + j.id + '\')">Assign driver</button>';
      else if (j.status === 'ONGOING') acts = '<button class="fin" onclick="act(\'finish\',\'' + j.id + '\',this)">Finish trip</button>';
      else                             acts = '<button class="go" onclick="act(\'go\',\'' + j.id + '\',this)">Start trip</button>';
      acts += '<button class="cxl" onclick="act(\'cancel\',\'' + j.id + '\',this)">Cancel</button>';

      var who2 = j.selfDrive ? 'SELF DRIVE' : (j.driver || 'no driver yet');

      return '<div class="job ' + j.status + '">' +
        '<div class="time">' + j.start + ' \u2013 ' + j.end + '</div>' +
        '<div class="id">' + j.id + ' \u00b7 ' + j.date + ' \u00b7 ' + j.status + '</div>' +
        '<div class="driver' + (j.driver || j.selfDrive ? '' : ' none') + '">' + who2 + '</div>' +
        '<p>' + j.vehicle + '</p><p>' + j.pickup + ' \u2192 ' + j.dropoff + '</p><p>' + j.req + '</p>' +
        (j.purpose ? '<p>' + j.purpose + '</p>' : '') +
        (j.astart ? '<span class="live">Running since ' + j.astart + '</span>' : '') +
        '<div class="acts">' + acts + '</div>' +
        '<div class="pick" id="pick-' + j.id + '"><p>Which driver?</p><div class="names">' +
          DRIVERS.map(function (d) {
            return '<button onclick="assign(\'' + j.id + '\',\'' + d.id + '\')">' + d.name + '</button>';
          }).join('') +
          (DRIVERS.length ? '' : '<span style="color:#5C6B62;font-size:14px">No active drivers in People.</span>') +
        '</div></div></div>';
    }).join('') + '</div>';
  }).catch(function (err) {
    document.getElementById('body').innerHTML = '<p class="empty">Could not reach the server.<br>' + err.message + '</p>';
  });
}

function setCount(n) {
  var el = document.getElementById('pcount');
  el.textContent = n;
  el.style.display = n ? 'inline-block' : 'none';
}

function showPick(id) {
  var el = document.getElementById('pick-' + id);
  el.className = (el.className.indexOf('on') > -1) ? 'pick' : 'pick on';
}

function assign(id, driverId) {
  api('assign', { id: id, driverId: driverId }).then(function (res) {
    toast(res && res.message ? res.message : 'Done'); load();
  }).catch(function (err) { toast('Failed: ' + err.message); });
}

function act(what, id, btn) {
  if (what === 'cancel' && !confirm('Cancel ' + id + '?')) return;
  btn.disabled = true;
  api(what, { id: id, reason: 'from dispatch board' }).then(function (res) {
    toast(res && res.message ? res.message : 'Done'); load();
  }).catch(function (err) { toast('Failed: ' + err.message); btn.disabled = false; });
}

/* ---------------- calendar ---------------- */

function setMode(m) {
  CAL_MODE = m;
  ['day', 'week', 'month'].forEach(function (n) {
    document.getElementById('m-' + n).className = (n === m ? 'on' : '');
  });
  loadCal();
}

function today() { CAL_DATE = isoToday(); loadCal(); }

function step(n) {
  var p = CAL_DATE.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  if (CAL_MODE === 'day') d.setDate(d.getDate() + n);
  else if (CAL_MODE === 'week') d.setDate(d.getDate() + 7 * n);
  else d.setMonth(d.getMonth() + n);
  CAL_DATE = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  loadCal();
}

function toMin(t) {
  var p = String(t).split(':');
  return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
}

function loadCal() {
  var box = document.getElementById('body');
  box.innerHTML = '<p class="empty">Loading…</p>';

  api('calendar', { mode: CAL_MODE, date: CAL_DATE }).then(function (r) {
    if (!r || !r.ok) { box.innerHTML = '<p class="empty">' + ((r && r.message) || 'Could not load.') + '</p>'; return; }

    document.getElementById('caltitle').textContent = r.label || '';
    document.getElementById('label').textContent = 'Calendar';

    var types = Object.keys(r.fleet);
    if (!types.length) { box.innerHTML = '<p class="empty">No vehicles in the Fleet tab.</p>'; return; }

    var html = (r.mode === 'day')   ? dayView(r, types)
             : (r.mode === 'week')  ? weekView(r, types)
                                    : monthView(r);

    box.innerHTML = '<div class="calwrap">' + html + '</div>' +
      '<div class="legend">' +
        '<span><i style="background:#B07D00"></i> Waiting</span>' +
        '<span><i style="background:#2E6B4C"></i> Approved</span>' +
        '<span><i style="background:#2F4E8F"></i> Running</span>' +
        '<span><i style="background:#8A968E"></i> Finished</span>' +
      '</div>';
  }).catch(function (err) {
    box.innerHTML = '<p class="empty">Could not reach the server.<br>' + err.message + '</p>';
  });
}

function dayView(r, types) {
  var open = toMin(r.open), close = toMin(r.close);
  if (close <= open) close = 24 * 60;
  var span = close - open;

  var hours = [];
  for (var h = Math.floor(open / 60); h <= Math.ceil(close / 60); h++) hours.push(h);

  var head = '<tr><th class="rowhead">Vehicle</th><th>' +
    '<div style="display:flex;justify-content:space-between;font-size:11px;color:#5C6B62">' +
    hours.map(function (h) { return '<span>' + ('0' + h).slice(-2) + '</span>'; }).join('') +
    '</div></th></tr>';

  var rows = types.map(function (t) {
    var mine = r.bookings.filter(function (b) { return b.type === t; });

    // stack overlapping bookings into lanes
    var lanes = [];
    mine.sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
    mine.forEach(function (b) {
      var placed = false;
      for (var i = 0; i < lanes.length && !placed; i++) {
        if (toMin(b.start) >= lanes[i]) { lanes[i] = toMin(b.end); b.lane = i; placed = true; }
      }
      if (!placed) { b.lane = lanes.length; lanes.push(toMin(b.end)); }
    });

    var laneCount = Math.max(1, lanes.length);
    var barH = Math.max(16, Math.floor(50 / laneCount));

    var bars = mine.map(function (b) {
      var s = Math.max(open, toMin(b.start)), e = Math.min(close, toMin(b.end));
      if (e <= s) return '';
      var left = ((s - open) / span * 100).toFixed(2);
      var wide = ((e - s) / span * 100).toFixed(2);
      var top = b.lane * (barH + 2) + 2;
      return '<div class="bar2 ' + b.status + '" style="left:' + left + '%;width:' + wide +
        '%;top:' + top + 'px;height:' + barH + 'px" title="' + b.id + ' — ' + b.req + '">' +
        '<b>' + b.start + '</b> ' + (b.units > 1 ? 'x' + b.units + ' ' : '') + b.req + '</div>';
    }).join('');

    var grid = hours.map(function (h) {
      var pos = ((h * 60 - open) / span * 100).toFixed(2);
      return (pos >= 0 && pos <= 100) ? '<div class="hourline" style="left:' + pos + '%"></div>' : '';
    }).join('');

    return '<tr><td class="rowhead">' + t + '<small>' + r.fleet[t] + ' available</small></td>' +
      '<td><div class="track" style="height:' + Math.max(54, laneCount * (barH + 2) + 4) + 'px">' +
      grid + bars + '</div></td></tr>';
  }).join('');

  return '<table class="cal">' + head + rows + '</table>';
}

function weekView(r, types) {
  var days = [];
  var p = r.from.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  for (var i = 0; i < 7; i++) {
    var iso = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
    days.push({ iso: iso, label: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i] + ' ' + d.getDate() });
    d.setDate(d.getDate() + 1);
  }

  var head = '<tr><th class="rowhead">Vehicle</th>' +
    days.map(function (x) { return '<th>' + x.label + '</th>'; }).join('') + '</tr>';

  var rows = types.map(function (t) {
    var cells = days.map(function (x) {
      var mine = r.bookings.filter(function (b) { return b.type === t && b.date === x.iso; });
      var peak = peakUnits(mine);
      var full = peak >= r.fleet[t];
      return '<td class="' + (x.iso === r.today ? 'today' : '') + '"><div class="cell">' +
        (mine.length ? '<div class="load' + (full ? ' full' : '') + '">' + peak + '/' + r.fleet[t] + ' used</div>' : '') +
        mine.map(function (b) {
          return '<span class="chip ' + b.status + '">' + b.start + ' ' +
            (b.units > 1 ? 'x' + b.units + ' ' : '') + b.req + '</span>';
        }).join('') + '</div></td>';
    }).join('');
    return '<tr><td class="rowhead">' + t + '<small>' + r.fleet[t] + ' available</small></td>' + cells + '</tr>';
  }).join('');

  return '<table class="cal">' + head + rows + '</table>';
}

function monthView(r) {
  var p = r.from.split('-');
  var first = new Date(Number(p[0]), Number(p[1]) - 1, 1);
  var start = new Date(first);
  start.setDate(1 - ((first.getDay() + 6) % 7));

  var head = '<tr>' + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    .map(function (x) { return '<th>' + x + '</th>'; }).join('') + '</tr>';

  var body = '', cur = new Date(start);
  for (var w = 0; w < 6; w++) {
    var row = '';
    for (var i = 0; i < 7; i++) {
      var iso = cur.getFullYear() + '-' + ('0' + (cur.getMonth() + 1)).slice(-2) + '-' + ('0' + cur.getDate()).slice(-2);
      var inMonth = (cur.getMonth() === first.getMonth());
      var mine = r.bookings.filter(function (b) { return b.date === iso; });

      var byType = {};
      mine.forEach(function (b) { (byType[b.type] = byType[b.type] || []).push(b); });

      row += '<td class="' + (iso === r.today ? 'today' : '') + '" style="' +
        (inMonth ? '' : 'opacity:.35') + '"><div class="cell">' +
        '<div class="load">' + cur.getDate() + (mine.length ? ' \u00b7 ' + mine.length : '') + '</div>' +
        Object.keys(byType).map(function (t) {
          var peak = peakUnits(byType[t]);
          var full = peak >= (r.fleet[t] || 99);
          return '<span class="chip ' + (full ? 'PENDING' : 'APPROVED') + '">' +
            t.replace('-seater', '') + ' ' + peak + '/' + (r.fleet[t] || '?') + '</span>';
        }).join('') + '</div></td>';

      cur.setDate(cur.getDate() + 1);
    }
    body += '<tr>' + row + '</tr>';
    if (cur.getMonth() !== first.getMonth() && w >= 3) break;
  }

  return '<table class="cal">' + head + body + '</table>';
}

/** Highest number of units in use at any one moment. */
function peakUnits(list) {
  var points = [];
  list.forEach(function (b) {
    points.push({ t: toMin(b.start), n: b.units });
    points.push({ t: toMin(b.end), n: -b.units });
  });
  points.sort(function (a, b) { return a.t - b.t || a.n - b.n; });

  var cur = 0, max = 0;
  points.forEach(function (p) { cur += p.n; if (cur > max) max = cur; });
  return max;
}

function refreshCount() {
  api('board', { when: 'pending', driverId: '' }).then(function (r) {
    if (r && r.ok) setCount(r.jobs.length);
  });
}
refreshCount();
setInterval(refreshCount, 60000);

load();
setInterval(function () { if (VIEW !== 'calendar') load(); }, 60000);
</script>
</body>
</html>
