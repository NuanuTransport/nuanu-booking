<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Vehicle Work Order Transport</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#17251E; --paper:#F1F3EF; --card:#fff;
  --line:#C9D2CB; --muted:#5C6B62; --moss:#2E6B4C; --stop:#B03A2E;
  --amber:#B07D00; --blue:#2F4E8F;
}
*{box-sizing:border-box}
html{width:100%;height:100%;overflow:hidden}
body{
  position:fixed;top:0;left:0;right:0;bottom:0;
  width:100%;overflow-y:auto;overflow-x:hidden;
  touch-action:pan-y;overscroll-behavior:none;-webkit-overflow-scrolling:touch;
  margin:0;padding:0;-webkit-text-size-adjust:100%;
  background:var(--paper);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.5;
}
.wrap{width:100%;max-width:460px;margin:0 auto;padding:16px 16px 90px;overflow:hidden}

header{margin-bottom:14px}
h1{font-size:20px;margin:0 0 2px;line-height:1.2;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13.5px}

nav{display:flex;gap:3px;margin:14px 0 18px;background:#E4EAE4;padding:3px;border-radius:8px}
nav button{
  flex:1;min-width:0;padding:9px 2px;font-size:12.5px;font-weight:600;font-family:inherit;
  background:transparent;color:var(--muted);border:0;border-radius:6px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
nav button.on{background:var(--card);color:var(--ink)}

.tab{display:none}
.tab.on{display:block}

.field{margin-bottom:16px;overflow:hidden}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.hint{font-weight:400;color:var(--muted);font-size:12.5px}

input,select,textarea{
  display:block;width:100%;min-width:0;max-width:100%;
  padding:11px 12px;font-size:16px;font-family:inherit;
  border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);
}
input[type=date],input[type=time]{
  width:100% !important;min-width:0 !important;max-width:100% !important;
  -webkit-appearance:none;appearance:none;height:44px;line-height:22px;box-sizing:border-box;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--moss);outline-offset:-1px}
textarea{resize:vertical;min-height:54px}
.row{display:block}
.row .field{width:100%}

.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{flex:1 1 90px;min-width:0;margin:0}
.choice input{position:absolute;opacity:0;pointer-events:none;width:auto}
.choice span{
  display:block;text-align:center;padding:11px 4px;background:var(--card);
  border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.choice input:checked + span{background:var(--moss);border-color:var(--moss);color:#fff;font-weight:600}
.choice input:disabled + span{opacity:.4}
.days .choice{flex:1 1 38px}
.days .choice span{padding:10px 0;font-size:13px}

.tick{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin:0;cursor:pointer}
.tick input{width:20px !important;height:20px;margin:0;padding:0;flex:0 0 auto}
.repeat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 14px 2px;margin-bottom:16px}
.count{margin:-4px 0 14px;font-size:13.5px;color:var(--muted)}
.count.bad{color:var(--stop)}

button.go{
  display:block;width:100%;padding:14px;font-size:16px;font-weight:600;font-family:inherit;
  background:var(--moss);color:#fff;border:0;border-radius:6px;cursor:pointer;margin-top:6px;
}
button.go:disabled{opacity:.55}

#msg{
  display:none;padding:11px 13px;border-radius:6px;margin-bottom:14px;font-size:14px;
  background:#F6E3E0;border:1px solid #E2B7B0;color:#7A2A20;white-space:pre-line;
}
#msg.good{background:#E4EFE7;border-color:#B4D2BE;color:#1F4B34}

.bk{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:11px}
.bk .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bk b{font-size:14.5px;word-break:break-all}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:20px;background:#E4EAE4;color:var(--muted);white-space:nowrap}
.tag.PENDING{background:#F6EEDC;color:var(--amber)}
.tag.APPROVED{background:#E4EFE7;color:var(--moss)}
.tag.ONGOING{background:#E8EDF6;color:var(--blue)}
.tag.COMPLETED{background:#E4EAE4;color:var(--muted)}
.tag.CANCELLED,.tag.REJECTED,.tag.NOSHOW{background:#F6E3E0;color:var(--stop)}
.bk p{margin:5px 0 0;color:var(--muted);font-size:13.5px}
.bk .cost{margin-top:7px;font-size:13.5px;color:var(--ink);font-weight:600}

.acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.acts button{
  flex:1 1 90px;min-width:0;padding:10px 4px;font-size:13.5px;font-weight:600;font-family:inherit;
  border-radius:6px;cursor:pointer;background:var(--card);
}
.acts .ext{border:1px solid var(--moss);color:var(--moss)}
.acts .cxl{border:1px solid var(--stop);color:var(--stop)}
.acts .fin{border:0;background:var(--blue);color:#fff;flex:1 1 100%}
.extbox{display:none;margin-top:9px;gap:7px}
.extbox.on{display:flex}
.extbox input{flex:1 1 0;min-width:0}
.extbox button{flex:0 0 auto;padding:0 15px;background:var(--moss);color:#fff;border:0;border-radius:6px;font-weight:600;font-family:inherit}

.empty{color:var(--muted);text-align:center;padding:30px 0}
dl.me dt{font-weight:600;font-size:13.5px;margin-top:13px}
dl.me dd{margin:2px 0 0;color:var(--muted);word-break:break-word}
.small{color:var(--muted);font-size:12.5px;margin-top:16px}

#done{display:none}
#done .card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--moss);border-radius:8px;padding:16px}
#done h2{margin:0 0 4px;font-size:18px}
#done pre{font-family:inherit;white-space:pre-wrap;word-break:break-word;margin:10px 0 0;color:var(--muted);font-size:14px}

#boot{padding:50px 18px;text-align:center;color:var(--muted);font-size:14px}
#boot .diag{font-size:11.5px;word-break:break-all;margin-top:14px;color:#9AA69E;text-align:left}
</style>
</head>
<body>

<div id="boot" style="display:none"></div>

<div id="app" class="wrap" style="display:block">
  <header>
    <h1>Vehicle Work Order Transport</h1>
    <p id="wholine">&nbsp;</p>
  </header>

  <nav>
    <button id="t1" class="on" onclick="tab('book')">Book</button>
    <button id="t2" onclick="tab('list')">Active</button>
    <button id="t3" onclick="tab('hist')">History</button>
    <button id="t4" onclick="tab('me')">Me</button>
  </nav>

  <div id="msg"></div>

  <div id="tab-book" class="tab on">
    <div id="form-view">
      <div id="behalf" style="display:none">
        <div class="field"><label>Requester name</label><input type="text" id="guestName"></div>
        <div class="field"><label>Their department</label><input type="text" id="guestDept"></div>
      </div>

      <div class="field"><label id="dateLabel">Date</label><input type="date" id="date" onchange="countRepeat()"></div>

      <!-- repeat: only shown for Book for someone else -->
      <div id="repeatBox" style="display:none">
        <div class="repeat">
          <div class="field">
            <label class="tick"><input type="checkbox" id="repeatOn" onchange="toggleRepeat()"> Repeat on more days</label>
          </div>
          <div id="repeatOpts" style="display:none">
            <div class="field"><label>Last date</label><input type="date" id="until" onchange="countRepeat()"></div>
            <div class="field">
              <label>On these days</label>
              <div class="choices days">
                <label class="choice"><input type="checkbox" name="rday" value="1" checked onchange="countRepeat()"><span>Mon</span></label>
                <label class="choice"><input type="checkbox" name="rday" value="2" checked onchange="countRepeat()"><span>Tue</span></label>
                <label class="choice"><input type="checkbox" name="rday" value="3" checked onchange="countRepeat()"><span>Wed</span></label>
                <label class="choice"><input type="checkbox" name="rday" value="4" checked onchange="countRepeat()"><span>Thu</span></label>
                <label class="choice"><input type="checkbox" name="rday" value="5" checked onchange="countRepeat()"><span>Fri</span></label>
                <label class="choice"><input type="checkbox" name="rday" value="6" checked onchange="countRepeat()"><span>Sat</span></label>
                <label class="choice"><input type="checkbox" name="rday" value="0" checked onchange="countRepeat()"><span>Sun</span></label>
              </div>
            </div>
            <div class="field">
              <label>If a date is already full</label>
              <div class="choices">
                <label class="choice"><input type="radio" name="full" value="stop" checked><span>Stop and tell me</span></label>
                <label class="choice"><input type="radio" name="full" value="skip"><span>Skip full dates</span></label>
              </div>
            </div>
            <p class="count" id="repeatCount"></p>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Vehicle</label>
        <div class="choices">
          <label class="choice"><input type="radio" name="type" value="6-seater" checked><span>6-seater</span></label>
          <label class="choice"><input type="radio" name="type" value="13-seater"><span>13-seater</span></label>
          <label class="choice"><input type="radio" name="type" value="23-seater"><span>23-seater</span></label>
          <label class="choice"><input type="radio" name="type" value="cargo"><span>Cargo</span></label>
          <label class="choice"><input type="radio" name="type" value="motorcycle"><span>Motorcycle</span></label>
        </div>
      </div>

      <div class="field">
        <label>Driver <span class="hint">— self drive for 6-seater, cargo and motorcycle</span></label>
        <div class="choices">
          <label class="choice"><input type="radio" name="driver" value="with" checked><span>With driver</span></label>
          <label class="choice"><input type="radio" name="driver" value="self" id="selfOpt"><span>Self drive</span></label>
        </div>
      </div>

      <div class="row">
        <div class="field"><label>Start</label><input type="time" id="start"></div>
        <div class="field"><label>End</label><input type="time" id="end"></div>
      </div>
      <div class="hint" id="nextDayNote" style="display:none;margin:-6px 0 14px;color:#2E6B4C;font-weight:600"></div>
      
      <div class="field">
        <label>How many vehicles</label>
        <select id="units"><option>1</option></select>
      </div>

      <div class="field">
        <label>Pickup</label>
        <select id="pickup" onchange="other('pickup')"><option value="">Loading…</option></select>
        <input type="text" id="pickupOther" placeholder="Type the location" style="display:none;margin-top:8px">
      </div>

      <div class="field">
        <label>Drop-off</label>
        <select id="dropoff" onchange="other('dropoff')"><option value="">Loading…</option></select>
        <input type="text" id="dropoffOther" placeholder="Type the location" style="display:none;margin-top:8px">
      </div>

      <div class="field">
        <label>Purpose <span class="hint">— optional</span></label>
        <textarea id="purpose"></textarea>
      </div>

      <button class="go" id="btn" onclick="submitIt()">Loading…</button>

      <p class="small">
        Operating hours 08:00–22:00. Booking within 3 hours of the start time adds a
        last-minute charge. Cancelling within 1 hour of the start time is charged.
      </p>
    </div>

    <div id="done">
      <div class="card">
        <h2 id="doneTitle">Booking submitted</h2>
        <p id="doneId" class="hint"></p>
        <pre id="doneBody"></pre>
      </div>
      <button class="go" onclick="resetForm()" style="margin-top:14px">Book another</button>
    </div>
  </div>

  <div id="tab-list" class="tab"><div id="listBody"><p class="empty">Loading…</p></div></div>
  <div id="tab-hist" class="tab"><div id="histBody"><p class="empty">Loading…</p></div></div>
  <div id="tab-me" class="tab"><dl class="me" id="meBody"><p class="empty">Loading…</p></dl></div>
</div>

<script>
/* ==========================================================
   Your Apps Script /exec URL. If you ever make a NEW deployment,
   paste its URL here (and in board.html and boq.html).
   ========================================================== */
var API_URL = 'https://script.google.com/macros/s/AKfycbzgpjJpb96wLeKH0mHQfNJmtgk7nbuj34zpUxATGDRM_ReShbIVz-kegSBIdElie4dt/exec';
/* ========================================================== */

var TOKEN = '';
var ON_BEHALF = false;
var READY = false;
var REPEAT_MAX = 62;

function boot(msg, diag) {
  document.getElementById('app').style.display = 'none';
  var b = document.getElementById('boot');
  b.style.display = 'block';
  b.innerHTML = '<p>' + msg + '</p>' + (diag ? '<div class="diag">' + diag + '</div>' : '');
}

try { TOKEN = new URLSearchParams(window.location.search).get('t') || ''; }
catch (e) { var mm = window.location.search.match(/[?&]t=([^&]+)/); TOKEN = mm ? decodeURIComponent(mm[1]) : ''; }

try {
  if (window.Telegram && window.Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    if (Telegram.WebApp.disableVerticalSwipes) Telegram.WebApp.disableVerticalSwipes();
  }
} catch (e) {}


/* ---------------- helpers ---------------- */

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function js(s) { return String(s == null ? '' : s).replace(/[^A-Za-z0-9_\-.:]/g, ''); }
function val(id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; }
function money(n) { return Number(n || 0).toLocaleString('id-ID'); }

function isoOf(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function parseIso(s) { var p = String(s).split('-'); return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]), 12); }
function shortDay(iso) {
  var d = parseIso(iso);
  return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
}

function api(action, data, tries) {
  tries = tries || 0;
  var url = API_URL +
    '?action=' + encodeURIComponent(action) +
    '&t=' + encodeURIComponent(TOKEN) +
    '&data=' + encodeURIComponent(JSON.stringify(data || {})) +
    '&cb=' + Date.now();
  return fetch(url).then(function (r) { return r.text(); }).then(function (txt) {
    try { return JSON.parse(txt); }
    catch (e) { return again(action, data, tries); }
  }, function () { return again(action, data, tries); });
}

function again(action, data, tries) {
  if (tries >= 4) throw new Error('The server stayed busy.');
  return new Promise(function (res) {
    setTimeout(function () { res(api(action, data, tries + 1)); }, 1500 * (tries + 1));
  });
}


/* ---------------- start ---------------- */

function start() {
  if (API_URL.indexOf('PASTE_') === 0) { boot('This page is not finished.', 'API_URL was never filled in.'); return; }
  if (!TOKEN) { boot('This link is not valid. Send /book to the bot for a new one.'); return; }

  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Loading…';

  api('init').then(function (r) {
    if (!r || !r.ok) { boot((r && r.message) || 'Could not load.'); return; }

    ON_BEHALF = r.onBehalf === true;
    document.getElementById('wholine').textContent =
      ON_BEHALF ? 'Booking for someone else' : r.who + (r.dept ? ' · ' + r.dept : '');
    if (ON_BEHALF) {
      document.getElementById('behalf').style.display = 'block';
      document.getElementById('repeatBox').style.display = 'block';
    }

    FLEET = r.fleet || {};
    setUnits();
    document.getElementById('date').min = r.today;
    document.getElementById('until').min = r.today;

    ['pickup', 'dropoff'].forEach(function (id) {
      document.getElementById(id).innerHTML =
        (r.locations || []).map(function (L) { return '<option value="' + esc(L) + '">' + esc(L) + '</option>'; }).join('') +
        '<option value="__other">Other — type it</option>';
    });

    READY = true;
    btn.disabled = false;
    countRepeat();
  }).catch(function (err) {
    boot('Could not reach the server.', 'Error: ' + esc(err.message) + '<br><br>API_URL: ' + esc(API_URL));
  });
}
start();


/* ---------------- tabs ---------------- */

function tab(which) {
  ['book', 'list', 'hist', 'me'].forEach(function (n, i) {
    document.getElementById('tab-' + n).className = 'tab' + (n === which ? ' on' : '');
    document.getElementById('t' + (i + 1)).className = (n === which ? 'on' : '');
  });
  hideMsg();
  if (which === 'list') loadList();
  if (which === 'hist') loadHist();
  if (which === 'me') loadMe();
}

function showMsg(text, good) {
  var m = document.getElementById('msg');
  m.textContent = text;
  m.className = good ? 'good' : '';
  m.style.display = 'block';
  document.body.scrollTop = 0;
  window.scrollTo(0, 0);
}
function hideMsg() { document.getElementById('msg').style.display = 'none'; }


/* ---------------- book ---------------- */
function nextDayNote() {
  var s = val('start'), e = val('end'), n = document.getElementById('nextDayNote');
  if (!n) return;
  if (s && e && e <= s) {
    n.textContent = (e === s) ? 'Start and end cannot be the same time.' : 'Ends the next day at ' + e + '.';
    n.style.display = 'block';
  } else n.style.display = 'none';
}
['start', 'end'].forEach(function (id) {
  var el = document.getElementById(id);
  if (el) { el.addEventListener('input', nextDayNote); el.addEventListener('change', nextDayNote); }
});
  
var FLEET = {};

/** Unit choices go up to how many of that vehicle the fleet has. */
function setUnits() {
  var t = (document.querySelector('input[name=type]:checked') || {}).value || '6-seater';
  var max = Math.max(1, Math.min(60, Number(FLEET[t]) || 10));
  var sel = document.getElementById('units');
  var cur = Math.min(Number(sel.value) || 1, max);
  var html = '';
  for (var n = 1; n <= max; n++) html += '<option' + (n === cur ? ' selected' : '') + '>' + n + '</option>';
  sel.innerHTML = html;
}
  
var typeRadios = document.getElementsByName('type');
for (var i = 0; i < typeRadios.length; i++) {
  typeRadios[i].addEventListener('change', function () {
    var v = this.value;
    setUnits();
    var canSelf = (v === '6-seater' || v === 'cargo' || v === 'motorcycle');
    var mustSelf = (v === 'motorcycle');
    var self = document.getElementById('selfOpt');
    var withD = document.querySelector('input[name=driver][value=with]');
    self.disabled = !canSelf;
    withD.disabled = mustSelf;
    if (mustSelf) self.checked = true;
    else if (!canSelf && self.checked) withD.checked = true;
  });
}

function other(which) {
  var sel = document.getElementById(which);
  var box = document.getElementById(which + 'Other');
  box.style.display = (sel.value === '__other') ? 'block' : 'none';
  if (sel.value === '__other') box.focus();
}
function pick(which) {
  var sel = document.getElementById(which);
  return (sel.value === '__other') ? val(which + 'Other') : sel.value;
}
function radio(name) {
  var els = document.getElementsByName(name);
  for (var i = 0; i < els.length; i++) if (els[i].checked) return els[i].value;
  return '';
}


/* ---- repeat ---- */

function repeatIsOn() {
  return ON_BEHALF && document.getElementById('repeatOn').checked;
}

function toggleRepeat() {
  var on = repeatIsOn();
  document.getElementById('repeatOpts').style.display = on ? 'block' : 'none';
  document.getElementById('dateLabel').textContent = on ? 'First date' : 'Date';
  if (on && !val('until') && val('date')) {
    var d = parseIso(val('date')); d.setDate(d.getDate() + 6);
    document.getElementById('until').value = isoOf(d);
  }
  countRepeat();
}

function pickedDays() {
  var out = [], els = document.getElementsByName('rday');
  for (var i = 0; i < els.length; i++) if (els[i].checked) out.push(Number(els[i].value));
  return out;
}

function repeatDates() {
  var a = val('date'), b = val('until');
  if (!a || !b || b < a) return [];
  var days = pickedDays(), out = [], d = parseIso(a), end = parseIso(b), guard = 0;
  while (d <= end && guard++ < 400) {
    if (days.indexOf(d.getDay()) > -1) out.push(isoOf(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function countRepeat() {
  var btn = document.getElementById('btn');
  var hint = document.getElementById('repeatCount');
  if (!repeatIsOn()) {
    if (READY && !btn.disabled) btn.textContent = 'Submit booking';
    return;
  }

  var list = repeatDates();
  hint.className = 'count';
  if (!val('date') || !val('until')) hint.textContent = 'Choose the first and the last date.';
  else if (val('until') < val('date')) { hint.textContent = 'The last date is before the first date.'; hint.className = 'count bad'; }
  else if (!list.length) { hint.textContent = 'None of the ticked days fall between those dates.'; hint.className = 'count bad'; }
  else if (list.length > REPEAT_MAX) { hint.textContent = list.length + ' bookings — too many. Keep it to ' + REPEAT_MAX + '.'; hint.className = 'count bad'; }
  else hint.textContent = list.length + ' bookings: ' + shortDay(list[0]) + ' to ' + shortDay(list[list.length - 1]) + '.';

  if (READY && !btn.disabled) btn.textContent = list.length ? 'Submit ' + list.length + ' bookings' : 'Submit bookings';
}


function submitIt() {
  var btn = document.getElementById('btn');
  hideMsg();

  var payload = {
    date: val('date'),
    type: radio('type'), driver: radio('driver'),
    units: val('units'),
    start: val('start'),
    end: val('end'),
    pickup: pick('pickup'), dropoff: pick('dropoff'),
    purpose: val('purpose')
  };
  if (ON_BEHALF) {
    payload.guestName = val('guestName');
    payload.guestDept = val('guestDept');
  }

  var action = 'submit', repeat = repeatIsOn();
  if (repeat) {
    var list = repeatDates();
    if (!list.length) { showMsg('Choose the last date and tick at least one day.'); return; }
    if (list.length > REPEAT_MAX) { showMsg('That is ' + list.length + ' bookings. Keep a repeat to ' + REPEAT_MAX + ' or fewer.'); return; }
    payload.repeat = { until: val('until'), days: pickedDays(), skipFull: radio('full') === 'skip' };
    payload.rk = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);   // stops a double submit
    action = 'batch';
  }

  var label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sending…';

  api(action, payload).then(function (res) {
    btn.disabled = false; btn.textContent = label;
    if (res && res.ok) {
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('doneTitle').textContent = repeat ? (res.count + ' bookings submitted') : 'Booking submitted';
      document.getElementById('doneId').textContent = repeat ? ('Repeat ' + res.batch) : res.message;
      document.getElementById('doneBody').textContent = res.summary || '';
      document.getElementById('done').style.display = 'block';
      document.body.scrollTop = 0;
      window.scrollTo(0, 0);
    } else {
      showMsg(res ? res.message : 'Something went wrong.');
    }
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = label;
    showMsg('Could not submit: ' + err.message);
  });
}

function resetForm() {
  document.getElementById('done').style.display = 'none';
  document.getElementById('form-view').style.display = 'block';
  ['date', 'until', 'start', 'end', 'purpose', 'pickupOther', 'dropoffOther'].forEach(function (id) {
    var el = document.getElementById(id); if (el) el.value = '';
  });
  document.getElementById('repeatOn').checked = false;
  toggleRepeat();
  nextDayNote();
  document.body.scrollTop = 0;
  window.scrollTo(0, 0);
}


/* ---------------- active ---------------- */

function loadList() {
  var box = document.getElementById('listBody');
  box.innerHTML = '<p class="empty">Loading…</p>';

  api('list').then(function (res) {
    if (!res || !res.ok) { box.innerHTML = '<p class="empty">' + esc((res && res.message) || 'Could not load.') + '</p>'; return; }
    if (!res.bookings.length) { box.innerHTML = '<p class="empty">No active bookings.</p>'; return; }

    box.innerHTML = res.bookings.map(function (b) {
      var id = js(b.id), acts = '';
      if (b.status === 'ONGOING' && b.selfDrive) {
        acts += '<button class="fin" onclick="doFinish(\'' + id + '\')">Finish trip</button>';
      }
      acts += '<button class="ext" onclick="showExt(\'' + id + '\')">Add time</button>' +
              '<button class="cxl" onclick="doCancel(\'' + id + '\')">Cancel</button>';

      return '<div class="bk">' +
        '<div class="top"><b>' + esc(b.id) + '</b><span class="tag ' + js(b.status) + '">' + esc(b.status) + '</span></div>' +
        '<p>' + esc(b.when) + '</p><p>' + esc(b.vehicle) + '</p><p>' + esc(b.route) + '</p>' +
        (b.driver ? '<p>Driver: ' + esc(b.driver) + '</p>' : '') +
        '<div class="acts">' + acts + '</div>' +
        '<div class="extbox" id="ext-' + id + '">' +
          '<input type="time" id="endt-' + id + '" value="' + esc(b.end) + '">' +
          '<button onclick="doExtend(\'' + id + '\')">Save</button>' +
        '</div></div>';
    }).join('');
  }).catch(function (err) {
    box.innerHTML = '<p class="empty">Could not load: ' + esc(err.message) + '</p>';
  });
}

function showExt(id) {
  var el = document.getElementById('ext-' + id);
  el.className = (el.className.indexOf('on') > -1) ? 'extbox' : 'extbox on';
}

function doExtend(id) {
  var t = val('endt-' + id);
  if (!t) { showMsg('Choose a new end time first.'); return; }
  api('extend', { id: id, end: t }).then(function (res) {
    showMsg(res.message, res.ok);
    if (res.ok) loadList();
  });
}

function doCancel(id) {
  if (!confirm('Cancel ' + id + '?\n\nCancelling close to the start time is charged.')) return;
  api('cancel', { id: id, reason: 'cancelled from app' }).then(function (res) {
    showMsg(res.message, res.ok);
    if (res.ok) loadList();
  });
}

function doFinish(id) {
  if (!confirm('Finish ' + id + ' now?\n\nThe bill will be calculated.')) return;
  api('finish', { id: id }).then(function (res) {
    showMsg(res.message, res.ok);
    if (res.ok) loadList();
  });
}


/* ---------------- history ---------------- */

function loadHist() {
  var box = document.getElementById('histBody');
  box.innerHTML = '<p class="empty">Loading…</p>';

  api('history').then(function (res) {
    if (!res || !res.ok) { box.innerHTML = '<p class="empty">' + esc((res && res.message) || 'Could not load.') + '</p>'; return; }
    if (!res.bookings.length) { box.innerHTML = '<p class="empty">Nothing here yet.</p>'; return; }

    box.innerHTML = res.bookings.map(function (b) {
      return '<div class="bk">' +
        '<div class="top"><b>' + esc(b.id) + '</b><span class="tag ' + js(b.status) + '">' + esc(b.status) + '</span></div>' +
        '<p>' + esc(b.when) + '</p><p>' + esc(b.vehicle) + '</p><p>' + esc(b.route) + '</p>' +
        (b.driver ? '<p>Driver: ' + esc(b.driver) + '</p>' : '') +
        (b.total ? '<div class="cost">' + money(b.total) + '</div>' : '') +
        '</div>';
    }).join('');
  }).catch(function (err) {
    box.innerHTML = '<p class="empty">Could not load: ' + esc(err.message) + '</p>';
  });
}


/* ---------------- me ---------------- */

function loadMe() {
  var box = document.getElementById('meBody');
  api('me').then(function (r) {
    if (!r || !r.ok) { box.innerHTML = '<p class="empty">Could not load.</p>'; return; }
    var html = '<dt>Name</dt><dd>' + esc(r.name) + '</dd>' +
               '<dt>Department</dt><dd>' + esc(r.dept) + '</dd>' +
               '<dt>Role</dt><dd>' + esc(r.role) + '</dd>';
    if (r.wa || r.tg) {
      html += '<dt>Need help?</dt><dd>' +
        (r.wa ? 'WhatsApp: ' + esc(r.wa) + '<br>' : '') +
        (r.tg ? 'Telegram: ' + esc(r.tg) : '') + '</dd>';
    }
    box.innerHTML = html;
  });
}
